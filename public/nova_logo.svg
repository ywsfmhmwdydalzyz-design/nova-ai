<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0c14"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d0f17" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="220" fill="url(#glowGrad)"/>

  <!-- Subtle Outer Tech Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Nova AI Futuristic Glowing "N" Core -->
  <g filter="url(#neonGlow)">
    <!-- Left vertical bar -->
    <path d="M 160 140 L 195 140 L 195 372 L 160 372 Z" fill="#00F0FF" rx="10"/>
    <!-- Diagonal stroke -->
    <path d="M 180 140 L 325 355 L 345 355 L 205 140 Z" fill="url(#neonGrad)"/>
    <!-- Right vertical bar -->
    <path d="M 317 140 L 352 140 L 352 372 L 317 372 Z" fill="#EC4899" rx="10"/>
    
    <!-- Central Nova Sparkle Star -->
    <path d="M 256 200 Q 256 256 200 256 Q 256 256 256 312 Q 256 256 312 256 Q 256 256 256 200 Z" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="6" fill="#00F0FF"/>
  </g>

  <!-- Orbiting sparkle accents -->
  <circle cx="340" cy="170" r="5" fill="#00F0FF"/>
  <circle cx="170" cy="340" r="5" fill="#EC4899"/>
  <circle cx="256" cy="115" r="4" fill="#FFFFFF"/>
</svg>